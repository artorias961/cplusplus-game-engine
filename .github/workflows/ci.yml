# Builds the engine, both games and all three test suites, then runs the tests.
#
# Two jobs, on Linux and macOS, and that is deliberate: development happens on
# Windows with vcpkg, so those are the platforms whose build path — CMake
# falling back to pkg-config — was documented but never actually exercised.
# This is what stops the README's cross-platform claim from being a guess.
#
# The tests need no display: none of them opens a window or initialises SDL's
# video subsystem, which is exactly what makes them runnable on a CI box.
#
# The Linux job can be run on Windows before pushing: `manual_testing\verify.bat
# linux` builds manual_testing/linux-ci.Dockerfile — the same Ubuntu and the
# same packages as below — and runs the same steps. It exists because this job
# was red for three commits over one missing #include that MSVC and macOS both
# forgave, and the only way to see why was to log in and read the log.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (pkg-config)
    # Pinned rather than `ubuntu-latest`, and matched by the FROM line in
    # manual_testing/linux-ci.Dockerfile. "Latest" moves to a new Ubuntu and a
    # new GCC on GitHub's schedule, not this project's; a pin means a red build
    # is always a change in this repository, and the local check stays an exact
    # copy. Move both lines together.
    runs-on: ubuntu-24.04
    steps:
      # v7 runs on Node 24. v4 ran on Node 20, which GitHub has deprecated and
      # was already forcing onto Node 24 with a warning on every run — the
      # step that turns into a hard failure the day Node 20 is removed.
      - uses: actions/checkout@v7

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # render_tests draws real frames through SDL's "dummy" video driver and
      # reads the pixels back, so the renderer is covered on a runner with no
      # display and no GPU. It needs no extra step: it is a ctest test like
      # the others, and CMake sets SDL_VIDEODRIVER=dummy for it.
      #
      # Repeated on purpose. The first real failure this pipeline caught was a
      # test that crashed roughly one run in twelve, because it depended on
      # where randomly placed rocks happened to drift. It passed CI twice
      # before failing. Running each suite twenty times costs a few seconds
      # and turns "it passed" into something worth believing.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --repeat until-fail:20 -LE smoke

      # The shipped binaries, started for half a second each on a runner with
      # no display. Nothing else in the suite executes main.cpp, the real
      # Engine::run, window creation or audio startup: a game that crashed on
      # its first frame would pass everything above.
      #
      # Run once, not twenty times — starting a process is not the kind of
      # test repetition finds flakes in.
      - name: The games start
        run: ctest --test-dir build -C Release --output-on-failure -L smoke

      # run.sh is the double-clickable launcher, and it is written on Windows
      # where it cannot be tried. Running it here for real — rather than just
      # syntax-checking it — is the only way to know it works on the platforms
      # it exists for. The build already exists by now, so this reuses it.
      - name: Check the launcher script
        run: |
          chmod +x run.sh
          ./run.sh tests

  macos:
    name: macOS (Homebrew)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL2
        run: brew install sdl2 sdl2_image pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # render_tests draws real frames through SDL's "dummy" video driver and
      # reads the pixels back, so the renderer is covered on a runner with no
      # display and no GPU. It needs no extra step: it is a ctest test like
      # the others, and CMake sets SDL_VIDEODRIVER=dummy for it.
      #
      # Repeated on purpose. The first real failure this pipeline caught was a
      # test that crashed roughly one run in twelve, because it depended on
      # where randomly placed rocks happened to drift. It passed CI twice
      # before failing. Running each suite twenty times costs a few seconds
      # and turns "it passed" into something worth believing.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --repeat until-fail:20 -LE smoke

      # The shipped binaries, started for half a second each on a runner with
      # no display. Nothing else in the suite executes main.cpp, the real
      # Engine::run, window creation or audio startup: a game that crashed on
      # its first frame would pass everything above.
      #
      # Run once, not twenty times — starting a process is not the kind of
      # test repetition finds flakes in.
      - name: The games start
        run: ctest --test-dir build -C Release --output-on-failure -L smoke

      # run.sh is the double-clickable launcher, and it is written on Windows
      # where it cannot be tried. Running it here for real — rather than just
      # syntax-checking it — is the only way to know it works on the platforms
      # it exists for. The build already exists by now, so this reuses it.
      - name: Check the launcher script
        run: |
          chmod +x run.sh
          ./run.sh tests
